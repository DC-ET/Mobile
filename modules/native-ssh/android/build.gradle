plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nativessh'
version = '1.0.0'

android {
  namespace "expo.modules.nativessh"

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 35
    compileSdkVersion 35
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Kotlin SSH client. Pin exact versions: transitive upgrades of sshj pull in
  // BouncyCastle builds that break desugaring on older Android toolchains.
  implementation 'com.hierynomus:sshj:0.41.1'
  implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
  implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
  implementation 'org.slf4j:slf4j-api:2.0.16'
  implementation 'net.i2p.crypto:eddsa:0.3.0'
}
